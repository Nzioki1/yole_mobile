name: agent_mobile
description: Poste Finance Agent Mobile Application
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.1.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  demo_universe:
    path: ../../packages/demo_universe/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/poste-finance-logo.png
    - assets/brand/poste-finance-logo-light.png
    - assets/brand/poste-finance-mark.png
    - assets/brand/poste-finance-logo-header.png

